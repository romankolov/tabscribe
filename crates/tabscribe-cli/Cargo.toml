[package]
name = "tabscribe-cli"
description = "Command-line interface for tabscribe: transcribe audio to MIDI and tablature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tabscribe"
path = "src/main.rs"

[dependencies]
tabscribe-core = { workspace = true }
tabscribe-models = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = "3"
insta = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
neural-tract = ["tabscribe-core/neural-tract"]
neural-ort = ["tabscribe-core/neural-ort"]
